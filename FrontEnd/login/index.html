<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <div class="top">    
            <div class="logout">
                <a href="../index.html">
                    <span class="material-symbols-outlined">
                        arrow_back_ios
                    </span>
                    Sair
                </a>
            </div>
            
            <div class="darkmode">
                <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
                    <span class="material-symbols-outlined toggle-icon moon">
                        light_mode
                    </span>
                    <span class="material-symbols-outlined toggle-icon sun">
                        dark_mode
                    </span>
                    <span class="toggle-ball"></span>
                </button>
            </div>
        </div>
        <div class="logo"></div>
        <div class="form">
            <h1>Bem-vindo de volta!</h1>
            <h2><span>Faça login</span> para continuar</h2>
            <form id="loginForm">
                <input type="email" id="email" name="email" placeholder="Seu email" required>

                <input type="password" id="password" name="password" placeholder="*********" required>
                
                <button type="submit" class="btn">Entrar na demonstração local</button>
            
                <div class="demo-credentials" aria-label="Credenciais de demonstração">
                    <strong>Acessos de demonstração</strong>
                    <p>Professor: <b>professor@gmail.com</b> — senha: <b>123</b></p>
                    <p>Secretaria: <b>secretaria@gmail.com</b> — senha: <b>123</b></p>
                    <p>Aluno: <b>aluno@gmail.com</b> — senha: <b>123</b></p>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/educonnect-backend.js"></script>
    <script src="script.js"></script>
</body>

</html>
