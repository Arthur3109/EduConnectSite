<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhe o Desempenho</title>
    <link rel="stylesheet" href="menu.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back_ios" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>


    <div class="container">
        <div class="top">    
            <div class="logout">
                <a href="../index.html">
                    <span class="material-symbols-outlined">
                        arrow_back_ios
                    </span>
                    Sair
                </a>
            </div>
            
            <div class="darkmode">
                <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
                    <span class="material-symbols-outlined toggle-icon moon">
                        light_mode
                    </span>
                    <span class="material-symbols-outlined toggle-icon sun">
                        dark_mode
                    </span>
                    <span class="toggle-ball"></span>
                </button>
            </div>
        </div>

        <span class="subtitle">ACOMPANHE O DESEMPENHO</span>
        <h1>Olá, Francisco Cunha</h1>

        <div class="student-card">
            <div class="avatar-placeholder"></div>
            <span class="student-info">Fernando Cunha • Turma 8A</span>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-label">MAIOR NOTA</span>
                <span class="stat-value">8.2</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">FALTAS</span>
                <span class="stat-value">12</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">DISCIPLINAS</span>
                <span class="stat-value">6</span>
            </div>
        </div>

        <div>
            <a href="boletim/index.html"><button class="btn">Visualizar Boletim Completo</button></a>
        </div>
    </div>


    <script src="main.js"></script>
</body>

</html>
